<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Pruebas de Validación 5° Básico (Chile)</title>
    <style>
        /* Estilos CSS */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #004d99; /* Azul Mineduc */
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        /* Estilos del Menú Principal */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu-button {
            padding: 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .materia-btn { background-color: #d9534f; } /* Rojo */
        .materia-btn:hover { background-color: #c9302c; }

        .opcion-btn { background-color: #5cb85c; } /* Verde */
        .opcion-btn:hover { background-color: #4cae4c; }

        .timer-info {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            background-color: #f0ad4e; /* Amarillo-naranjo */
            color: #fff;
            border-radius: 5px;
            text-align: center;
        }

        /* Estilos de la Prueba */
        .prueba-container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .pregunta {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #f0f0f0;
            border-radius: 5px;
        }

        .pregunta p {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .opcion-respuesta {
            margin-left: 20px;
            margin-bottom: 5px;
            cursor: pointer;
        }
        
        /* Estilos para mostrar las respuestas */
        .respuesta-correcta {
            color: green;
            font-weight: bold;
            margin-top: 5px;
            padding-left: 20px;
            border-left: 3px solid green;
        }

        .boton-volver {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #004d99;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .boton-volver:hover {
            background-color: #003366;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo-principal">Simulador de Pruebas de Validación 5° Básico (25 Preguntas por Examen)</h1>
    <p>Selecciona una opción para comenzar. Cada prueba consta de **25 preguntas** y tiene una duración máxima de **90 minutos**.</p>

    <div id="menu-principal" class="menu-grid">
        <button class="menu-button materia-btn" onclick="iniciarPrueba('matematicas')">Matemáticas 🔢 (25 Preguntas)</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('lenguaje')">Lenguaje y Comunicación 📖 (25 Preguntas)</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('ciencias')">Ciencias Naturales 🔬 (25 Preguntas)</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('historia')">Historia, Geografía y C. Sociales 🌎 (25 Preguntas)</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('ingles')">Inglés 🇬🇧 (25 Preguntas)</button>
        
        <button class="menu-button opcion-btn" onclick="mostrarRespuestasGeneral()">Ver Respuestas (Todas) ✔️</button>
        <button id="timer-toggle-btn" class="menu-button opcion-btn" onclick="toggleTimer()">Activar/Desactivar Temporizador ⏱️</button>
    </div>

    <div id="timer-display" class="timer-info" style="display: none;"></div>

    <div id="prueba-area" class="prueba-container" style="display: none;">
        <h2 id="nombre-asignatura"></h2>
        <div id="preguntas-container">
            </div>
        <button class="menu-button materia-btn" onclick="corregirPrueba()">Finalizar Prueba y Corregir</button>
        <button class="boton-volver" onclick="volverAlMenu()">Volver al Menú Principal</button>
    </div>
</div>

<script>
    // Variables Globales
    let timerEnabled = true; // Por defecto, el temporizador está activo
    let timerInterval;
    const DURACION_MAXIMA = 90 * 60; // 90 minutos en segundos
    let timeLeft = DURACION_MAXIMA;
    let currentAsignatura = '';
    const TOTAL_PREGUNTAS = 25;

    // --- BANCO COMPLETO DE 125 PREGUNTAS Y RESPUESTAS ---
    const bancoDePreguntas = {
        'matematicas': [
            // OA 1: Valor Posicional
            { pregunta: `(OA 1) ¿Cuál es el valor posicional del dígito **4** en el número 542.871.000?`, opciones: ['40 millones', '4 millones', '400 mil', '400 millones'], respuestaCorrecta: '40 millones' },
            // OA 2: Comparación de números
            { pregunta: `(OA 2) ¿Cuál de las siguientes afirmaciones es **correcta**?`, opciones: ['56.780 > 56.870', '100.999 < 100.990', '430.500 < 430.050', '25.001 > 25.000'], respuestaCorrecta: '25.001 > 25.000' },
            // OA 3: Multiplicación
            { pregunta: `(OA 3) ¿Cuál es el resultado de la multiplicación 480 $\\times$ 35?`, opciones: ['16.800', '15.400', '14.800', '16.900'], respuestaCorrecta: '16.800' },
            // OA 4: División
            { pregunta: `(OA 4) Si 625 dulces se reparten en bolsas de 25, ¿cuántas bolsas se necesitan?`, opciones: ['15', '20', '25', '30'], respuestaCorrecta: '25' },
            // OA 5: Operaciones con decimales
            { pregunta: `(OA 5) Si sumas 15,7 y 8,4, ¿cuál es el resultado?`, opciones: ['23,1', '24,1', '23,4', '24,7'], respuestaCorrecta: '24,1' },
            // OA 6: Fracciones propias
            { pregunta: `(OA 6) ¿Cuál de las siguientes fracciones es **propia**?`, opciones: ['$\frac{5}{3}$', '$\frac{7}{7}$', '$\frac{2}{9}$', '$\frac{10}{6}$'], respuestaCorrecta: '$\frac{2}{9}$' },
            // OA 7: Suma y resta de fracciones
            { pregunta: `(OA 7) ¿Cuál es el resultado de $\frac{1}{4} + \frac{1}{2}$?`, opciones: ['$\frac{2}{6}$', '$\frac{2}{4}$', '$\frac{3}{4}$', '$\frac{1}{8}$'], respuestaCorrecta: '$\frac{3}{4}$' },
            // OA 10: Fracción a decimal
            { pregunta: `(OA 10) ¿A qué número decimal corresponde la fracción $\frac{1}{5}$?`, opciones: ['0,1', '0,2', '0,5', '0,25'], respuestaCorrecta: '0,2' },
            // OA 11: Múltiplos
            { pregunta: `(OA 11) ¿Cuál de los siguientes números es un **múltiplo** de 6?`, opciones: ['14', '20', '32', '42'], respuestaCorrecta: '42' },
            // OA 11: Factores
            { pregunta: `(OA 11) ¿Qué número es un **factor** de 30?`, opciones: ['7', '9', '6', '4'], respuestaCorrecta: '6' },
            // OA 12: Ángulos
            { pregunta: `(OA 12) ¿Cómo se llama un ángulo que mide exactamente 90 grados?`, opciones: ['Ángulo agudo', 'Ángulo obtuso', 'Ángulo recto', 'Ángulo extendido'], respuestaCorrecta: 'Ángulo recto' },
            // OA 13: Figuras 2D
            { pregunta: `(OA 13) Una figura plana con cinco lados y cinco vértices se llama:`, opciones: ['Cuadrilátero', 'Hexágono', 'Pentágono', 'Trapecio'], respuestaCorrecta: 'Pentágono' },
            // OA 14: Simetría
            { pregunta: `(OA 14) ¿Cuál de las siguientes letras tiene un eje de simetría horizontal?`, opciones: ['L', 'Z', 'C', 'P'], respuestaCorrecta: 'C' },
            // OA 8: Área
            { pregunta: `(OA 8) El área de un cuadrado de lado 7 cm es:`, opciones: ['14 cm²', '28 cm', '49 cm²', '49 cm'], respuestaCorrecta: '49 cm²' },
            // OA 9: Perímetro
            { pregunta: `(OA 9) El perímetro de un triángulo con lados de 5 cm, 7 cm y 10 cm es:`, opciones: ['12 cm', '17 cm', '22 cm', '35 cm'], respuestaCorrecta: '22 cm' },
            // OA 15: Gráficos de barras
            { pregunta: `(OA 15) Un gráfico que utiliza rectángulos para mostrar la frecuencia de datos se llama:`, opciones: ['Gráfico de puntos', 'Gráfico circular', 'Gráfico de barras', 'Pictograma'], respuestaCorrecta: 'Gráfico de barras' },
            // OA 16: Probabilidad
            { pregunta: `(OA 16) En una bolsa hay 3 bolas rojas y 7 azules. ¿Qué tan probable es sacar una bola verde?`, opciones: ['Seguro', 'Muy probable', 'Imposible', 'Poco probable'], respuestaCorrecta: 'Imposible' },
            // OA 18: Patrones (Regla)
            { pregunta: `(OA 18) Si el patrón es 3, 6, 9, 12, la regla es:`, opciones: ['Sumar 2', 'Multiplicar por 2', 'Sumar 3', 'Restar 3'], respuestaCorrecta: 'Sumar 3' },
            // OA 1: Lectura de números grandes
            { pregunta: `(OA 1) ¿Cómo se lee el número 1.000.000.000?`, opciones: ['Mil millones', 'Cien millones', 'Un millón', 'Diez mil millones'], respuestaCorrecta: 'Mil millones' },
            // OA 4: Resto de división
            { pregunta: `(OA 4) Al dividir 50 entre 6, ¿cuál es el resto?`, opciones: ['1', '2', '3', '4'], respuestaCorrecta: '2' },
            // OA 8: Volumen
            { pregunta: `(OA 8) La medida del espacio que ocupa un cuerpo se denomina:`, opciones: ['Área', 'Perímetro', 'Volumen', 'Capacidad'], respuestaCorrecta: 'Volumen' },
            // OA 10: Suma de decimales
            { pregunta: `(OA 10) ¿Cuál es el resultado de 0,5 + 0,25?`, opciones: ['0,30', '0,75', '0,55', '1,0'], respuestaCorrecta: '0,75' },
            // OA 14: Traslación
            { pregunta: `(OA 14) Un movimiento que desplaza una figura sin rotarla ni reflejarla es una:`, opciones: ['Rotación', 'Reflexión', 'Traslación', 'Simetría'], respuestaCorrecta: 'Traslación' },
            // OA 16: Evento seguro
            { pregunta: `(OA 16) ¿Qué evento tiene una probabilidad de 1?`, opciones: ['Sacar cara en una moneda', 'Que salga el sol mañana', 'Lanzar un dado y que salga un 7', 'Que llueva'], respuestaCorrecta: 'Que salga el sol mañana' },
            // OA 3: Problemas de dos pasos
            { pregunta: `(OA 3) Si compré 5 lápices a $150 c/u y pagué con $1.000, ¿cuánto me dieron de vuelto?`, opciones: ['$250', '$350', '$750', '$450'], respuestaCorrecta: '$250' }
        ],
        'lenguaje': [
            // OA 4: Figuras literarias
            { pregunta: `(OA 4) ¿Qué figura literaria utiliza la frase: "La lluvia llora sin parar en el tejado"?`, opciones: ['Metáfora', 'Comparación', 'Personificación', 'Hipérbole'], respuestaCorrecta: 'Personificación' },
            // OA 5: Elementos de la poesía
            { pregunta: `(OA 5) ¿Cómo se llama al conjunto de versos que forma una unidad en un poema?`, opciones: ['Rima', 'Estrofa', 'Ritmo', 'Métrica'], respuestaCorrecta: 'Estrofa' },
            // OA 12: Sustantivos
            { pregunta: `(OA 12) ¿Cuál de las siguientes palabras es un **sustantivo propio**?`, opciones: ['Perro', 'Ciudad', 'Andrés', 'Montaña'], respuestaCorrecta: 'Andrés' },
            // OA 12: Adjetivos
            { pregunta: `(OA 12) En la frase "La casa es grande y azul", ¿cuáles son los adjetivos?`, opciones: ['La, casa', 'es, azul', 'grande, azul', 'casa, grande'], respuestaCorrecta: 'grande, azul' },
            // OA 13: Verbos
            { pregunta: `(OA 13) ¿Cuál es la forma no personal del verbo en la frase "El niño está **jugando**"?`, opciones: ['Jugaba', 'Jugará', 'Jugando', 'Jugó'], respuestaCorrecta: 'Jugando' },
            // OA 16: Conectores (Causa)
            { pregunta: `(OA 16) ¿Qué conector es más adecuado para expresar una **causa**?`, opciones: ['Aunque', 'Por lo tanto', 'También', 'Ya que'], respuestaCorrecta: 'Ya que' },
            // OA 17: Puntuación (Coma en enumeración)
            { pregunta: `(OA 17) ¿Cuál es la opción con el uso correcto de la coma en una enumeración?`, opciones: ['Compró lápices cuadernos y gomas.', 'Compró lápices, cuadernos, y gomas.', 'Compró lápices, cuadernos, gomas.', 'Compró lápices cuadernos, gomas.'], respuestaCorrecta: 'Compró lápices, cuadernos, gomas.' },
            // OA 19: Tipos de textos (Informativo)
            { pregunta: `(OA 19) Un texto que busca exponer información objetiva sobre un tema se llama:`, opciones: ['Narrativo', 'Lírico', 'Dramático', 'Informativo'], respuestaCorrecta: 'Informativo' },
            // OA 4: Idea principal
            { pregunta: `(OA 4) ¿Qué es la **idea principal** de un texto?`, opciones: ['Un detalle sin importancia', 'El tema secundario', 'El mensaje o tema central', 'La opinión del autor'], respuestaCorrecta: 'El mensaje o tema central' },
            // OA 14: Uso de mayúsculas
            { pregunta: `(OA 14) ¿En qué caso se debe usar mayúscula?`, opciones: ['Al final de una oración.', 'En nombres comunes.', 'En nombres de países y personas.', 'En adjetivos.'], respuestaCorrecta: 'En nombres de países y personas.' },
            // OA 5: Poesía (Hablante lírico)
            { pregunta: `(OA 5) La voz ficticia que expresa sentimientos en un poema se llama:`, opciones: ['Narrador', 'Poeta', 'Hablante lírico', 'Personaje'], respuestaCorrecta: 'Hablante lírico' },
            // OA 12: Artículo definido
            { pregunta: `(OA 12) ¿Cuál es el artículo definido para la palabra "árbol"?`, opciones: ['Una', 'Unos', 'El', 'Las'], respuestaCorrecta: 'El' },
            // OA 13: Tiempos verbales
            { pregunta: `(OA 13) El verbo "comieron" se encuentra en tiempo:`, opciones: ['Presente', 'Futuro', 'Pasado (Pretérito)', 'Condicional'], respuestaCorrecta: 'Pasado (Pretérito)' },
            // OA 16: Conectores (Oposición)
            { pregunta: `(OA 16) ¿Qué conector indica una **oposición** o contraste?`, opciones: ['Por lo tanto', 'Además', 'Sin embargo', 'Es decir'], respuestaCorrecta: 'Sin embargo' },
            // OA 22: Elementos de la comunicación oral
            { pregunta: `(OA 22) ¿Cómo se llama al que recibe el mensaje en una comunicación?`, opciones: ['Emisor', 'Receptor', 'Canal', 'Código'], respuestaCorrecta: 'Receptor' },
            // OA 23: Argumentación
            { pregunta: `(OA 23) ¿Cuál es el propósito de un texto argumentativo?`, opciones: ['Informar un hecho', 'Contar una historia', 'Convencer o persuadir', 'Describir un objeto'], respuestaCorrecta: 'Convencer o persuadir' },
            // OA 17: Uso de dos puntos
            { pregunta: `(OA 17) Los dos puntos (:) se usan antes de:`, opciones: ['Una pregunta', 'Una exclamación', 'Una enumeración anunciada', 'Un punto final'], respuestaCorrecta: 'Una enumeración anunciada' },
            // OA 14: Palabras con "H"
            { pregunta: `(OA 14) ¿Cuál de estas palabras se escribe con "H" inicial?`, opciones: ['Eco', 'Onda', 'Oja', 'Hueso'], respuestaCorrecta: 'Hueso' },
            // OA 19: Cuento
            { pregunta: `(OA 19) El texto narrativo breve, con pocos personajes y un solo conflicto es el:`, opciones: ['Novela', 'Ensayo', 'Cuento', 'Fábula'], respuestaCorrecta: 'Cuento' },
            // OA 12: Género y número
            { pregunta: `(OA 12) El sustantivo "las mesas" está en:`, opciones: ['Singular femenino', 'Plural masculino', 'Singular masculino', 'Plural femenino'], respuestaCorrecta: 'Plural femenino' },
            // OA 4: Secuencia de hechos
            { pregunta: `(OA 4) ¿Qué parte de un texto narrativo presenta la solución al conflicto?`, opciones: ['Inicio', 'Desarrollo', 'Desenlace', 'Clímax'], respuestaCorrecta: 'Desenlace' },
            // OA 13: Adverbios
            { pregunta: `(OA 13) La palabra "rápidamente" es un adverbio de:`, opciones: ['Tiempo', 'Lugar', 'Modo', 'Cantidad'], respuestaCorrecta: 'Modo' },
            // OA 16: Conectores (Adición)
            { pregunta: `(OA 16) ¿Cuál conector sirve para añadir información?`, opciones: ['Porque', 'Además', 'Pero', 'Entonces'], respuestaCorrecta: 'Además' },
            // OA 19: Mito y leyenda
            { pregunta: `(OA 19) Relato tradicional que busca explicar el origen del mundo o fenómenos naturales:`, opciones: ['Leyenda', 'Fábula', 'Mito', 'Novela'], respuestaCorrecta: 'Mito' },
            // OA 17: Punto aparte
            { pregunta: `(OA 17) ¿Qué signo de puntuación se usa para separar dos párrafos distintos?`, opciones: ['Punto seguido', 'Punto final', 'Coma', 'Punto aparte'], respuestaCorrecta: 'Punto aparte' }
        ],
        'ciencias': [
            // OA 1: Célula
            { pregunta: `(OA 1) La unidad fundamental, estructural y funcional de todo ser vivo es:`, opciones: ['El órgano', 'El tejido', 'La célula', 'El sistema'], respuestaCorrecta: 'La célula' },
            // OA 3: Sistema Digestivo
            { pregunta: `(OA 3) ¿Dónde comienza el proceso de la digestión química de los alimentos?`, opciones: ['Estómago', 'Intestino grueso', 'Boca', 'Esófago'], respuestaCorrecta: 'Boca' },
            // OA 4: Sistema Circulatorio
            { pregunta: `(OA 4) ¿Cuál es el órgano principal que impulsa la sangre a todo el cuerpo?`, opciones: ['Pulmón', 'Riñón', 'Corazón', 'Hígado'], respuestaCorrecta: 'Corazón' },
            // OA 5: Nutrientes
            { pregunta: `(OA 5) ¿Qué tipo de nutrientes son la principal fuente de energía rápida para el cuerpo?`, opciones: ['Proteínas', 'Vitaminas', 'Carbohidratos', 'Lípidos'], respuestaCorrecta: 'Carbohidratos' },
            // OA 5: Higiene
            { pregunta: `(OA 5) ¿Cuál de estas acciones es un hábito de higiene para prevenir enfermedades?`, opciones: ['Comer rápido', 'Dormir poco', 'Lavarse las manos antes de comer', 'Usar el mismo pañuelo'], respuestaCorrecta: 'Lavarse las manos antes de comer' },
            // OA 7: Ciclo del Agua (Condensación)
            { pregunta: `(OA 7) ¿Qué etapa del ciclo del agua corresponde a la formación de las nubes?`, opciones: ['Evaporación', 'Precipitación', 'Condensación', 'Fusión'], respuestaCorrecta: 'Condensación' },
            // OA 9: Estructura de la Tierra
            { pregunta: `(OA 9) ¿Cuál es la capa más interna de la Tierra, compuesta principalmente de metales fundidos?`, opciones: ['Manto', 'Corteza', 'Núcleo externo', 'Núcleo interno'], respuestaCorrecta: 'Núcleo interno' },
            // OA 10: Conductores
            { pregunta: `(OA 10) ¿Cuál de los siguientes materiales es un buen **conductor** de electricidad?`, opciones: ['Madera', 'Vidrio', 'Cobre', 'Goma'], respuestaCorrecta: 'Cobre' },
            // OA 11: Luz
            { pregunta: `(OA 11) La capacidad de la luz para doblarse al pasar de un medio a otro (ej. del aire al agua) se llama:`, opciones: ['Reflexión', 'Refracción', 'Absorción', 'Espectro'], respuestaCorrecta: 'Refracción' },
            // OA 13: Ecosistemas
            { pregunta: `(OA 13) Los organismos que producen su propio alimento (como las plantas) son:`, opciones: ['Consumidores', 'Descomponedores', 'Productores', 'Depredadores'], respuestaCorrecta: 'Productores' },
            // OA 1: Tejido
            { pregunta: `(OA 1) Un conjunto de células similares que cumplen una función específica se llama:`, opciones: ['Órgano', 'Tejido', 'Sistema', 'Célula'], respuestaCorrecta: 'Tejido' },
            // OA 3: Respiración
            { pregunta: `(OA 3) ¿Qué gas entra a nuestro cuerpo a través del sistema respiratorio?`, opciones: ['Dióxido de carbono', 'Nitrógeno', 'Oxígeno', 'Vapor de agua'], respuestaCorrecta: 'Oxígeno' },
            // OA 4: Sangre
            { pregunta: `(OA 4) ¿Qué componente de la sangre transporta el oxígeno?`, opciones: ['Plasma', 'Plaquetas', 'Glóbulos blancos', 'Glóbulos rojos'], respuestaCorrecta: 'Glóbulos rojos' },
            // OA 5: Pirámide alimenticia
            { pregunta: `(OA 5) ¿Qué tipo de alimento debe consumirse en menor cantidad según la pirámide alimenticia?`, opciones: ['Frutas', 'Cereales', 'Aceites y dulces', 'Verduras'], respuestaCorrecta: 'Aceites y dulces' },
            // OA 7: Agua (estado)
            { pregunta: `(OA 7) El proceso de cambio de estado de agua líquida a vapor se llama:`, opciones: ['Fusión', 'Evaporación', 'Solidificación', 'Sublimación'], respuestaCorrecta: 'Evaporación' },
            // OA 9: Sismos
            { pregunta: `(OA 9) El movimiento de las placas tectónicas que provoca temblores se genera en la:`, opciones: ['Corteza', 'Atmósfera', 'Hidrosfera', 'Biosfera'], respuestaCorrecta: 'Corteza' },
            // OA 10: Circuito en serie
            { pregunta: `(OA 10) En un circuito **en serie**, si una ampolleta se quema, ¿qué sucede con las demás?`, opciones: ['Siguen encendidas', 'Se encienden más fuerte', 'Se apagan', 'No les afecta'], respuestaCorrecta: 'Se apagan' },
            // OA 11: Sombra
            { pregunta: `(OA 11) La sombra se forma porque la luz viaja en línea recta y encuentra un objeto:`, opciones: ['Transparente', 'Traslúcido', 'Opaco', 'Reflector'], respuestaCorrecta: 'Opaco' },
            // OA 13: Cadenas tróficas
            { pregunta: `(OA 13) ¿Qué organismo se alimenta de los productores en una cadena trófica?`, opciones: ['Consumidor secundario', 'Consumidor terciario', 'Descomponedor', 'Consumidor primario'], respuestaCorrecta: 'Consumidor primario' },
            // OA 1: Niveles de organización
            { pregunta: `(OA 1) El estómago, el corazón y el pulmón son ejemplos de:`, opciones: ['Células', 'Tejidos', 'Órganos', 'Sistemas'], respuestaCorrecta: 'Órganos' },
            // OA 5: Grasas
            { pregunta: `(OA 5) Las grasas o lípidos tienen como función principal:`, opciones: ['Reparar tejidos', 'Aportar energía de reserva', 'Regular el cuerpo', 'Transportar oxígeno'], respuestaCorrecta: 'Aportar energía de reserva' },
            // OA 7: Lagos
            { pregunta: `(OA 7) La mayor parte del agua dulce **líquida** accesible en la Tierra se encuentra en:`, opciones: ['Océanos', 'Glaciares', 'Lagos y ríos', 'Atmósfera'], respuestaCorrecta: 'Lagos y ríos' },
            // OA 9: Vulcanismo

    // --- FUNCIONES DEL TEMPORIZADOR Y SIMULACIÓN ---

    /**
     * Alterna la activación/desactivación del temporizador.
     */
    function toggleTimer() {
        timerEnabled = !timerEnabled;
        const toggleBtn = document.getElementById('timer-toggle-btn');
        if (timerEnabled) {
            toggleBtn.textContent = 'Desactivar Temporizador ⏱️';
            if (currentAsignatura) {
                document.getElementById('timer-display').style.display = 'block';
                startTimer();
            }
        } else {
            toggleBtn.textContent = 'Activar Temporizador ⏱️';
            clearInterval(timerInterval);
            document.getElementById('timer-display').style.display = 'none';
        }
        alert(`Temporizador ha sido ${timerEnabled ? 'ACTIVADO' : 'DESACTIVADO'}.`);
    }

    /**
     * Inicia el contador de 90 minutos.
     */
    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = DURACION_MAXIMA;
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("¡Tiempo finalizado! La prueba ha terminado automáticamente.");
                corregirPrueba();
            }
        }, 1000);
    }

    /**
     * Detiene el contador.
     */
    function stopTimer() {
        clearInterval(timerInterval);
    }

    /**
     * Actualiza la visualización del tiempo restante.
     */
    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        document.getElementById('timer-display').textContent = `Tiempo restante: ${display}`;
    }

    /**
     * Inicia la simulación de la prueba para una asignatura.
     */
    function iniciarPrueba(asignatura) {
        currentAsignatura = asignatura;
        const nombreFormal = {
            'matematicas': 'Matemáticas',
            'lenguaje': 'Lenguaje y Comunicación',
            'ciencias': 'Ciencias Naturales',
            'historia': 'Historia, Geografía y Ciencias Sociales',
            'ingles': 'Inglés'
        }[asignatura];

        document.getElementById('menu-principal').style.display = 'none';
        document.getElementById('prueba-area').style.display = 'block';
        document.getElementById('nombre-asignatura').textContent = `Prueba de ${nombreFormal} (25 Preguntas)`;

        if (timerEnabled) {
            document.getElementById('timer-display').style.display = 'block';
            startTimer();
        }

        // Eliminar resumen anterior si existe
        const resumen = document.getElementById('resumen-resultados');
        if (resumen) resumen.remove();

        cargarPreguntas(asignatura);
    }

    /**
     * Carga las preguntas de la asignatura seleccionada.
     */
    function cargarPreguntas(asignatura) {
        const preguntas = bancoDePreguntas[asignatura];
        const container = document.getElementById('preguntas-container');
        container.innerHTML = ''; // Limpiar

        preguntas.forEach((p, index) => {
            const numPregunta = index + 1;
            const preguntaDiv = document.createElement('div');
            preguntaDiv.className = 'pregunta';
            preguntaDiv.id = `pregunta-${numPregunta}`;
            
            let html = `<p>${numPregunta}. ${p.pregunta}</p>`;
            
            p.opciones.forEach((opcion, i) => {
                const id = `q${numPregunta}-op${i}`;
                html += `
                    <div class="opcion-respuesta">
                        <input type="radio" id="${id}" name="respuesta-${numPregunta}" value="${opcion}">
                        <label for="${id}">${opcion}</label>
                    </div>
                `;
            });
            
            preguntaDiv.innerHTML = html;
            container.appendChild(preguntaDiv);
        });
    }

    /**
     * Procesa y muestra los resultados de la prueba actual, destacando las correctas.
     */
    function corregirPrueba() {
        if (!currentAsignatura) {
            alert("No hay una prueba activa para corregir.");
            return;
        }

        if (timerEnabled) {
            stopTimer();
        }

        const preguntas = bancoDePreguntas[currentAsignatura];
        let correctas = 0;
        
        preguntas.forEach((p, index) => {
            const numPregunta = index + 1;
            const nombreInput = `respuesta-${numPregunta}`;
            const respuestaSeleccionada = document.querySelector(`input[name="${nombreInput}"]:checked`);
            const preguntaDiv = document.getElementById(`pregunta-${numPregunta}`);
            const esCorrecta = respuestaSeleccionada && respuestaSeleccionada.value === p.respuestaCorrecta;

            let resultadoHTML = preguntaDiv.querySelector('.respuesta-correcta');
            if (!resultadoHTML) {
                 resultadoHTML = document.createElement('p');
                 resultadoHTML.className = 'respuesta-correcta';
                 preguntaDiv.appendChild(resultadoHTML);
            }

            // Aplicar estilo de corrección
            if (esCorrecta) {
                correctas++;
                preguntaDiv.style.backgroundColor = '#e6ffe6'; // Verde claro
            } else {
                preguntaDiv.style.backgroundColor = '#ffe6e6'; // Rojo claro
            }
            resultadoHTML.textContent = `Respuesta Correcta: ${p.respuestaCorrecta}${esCorrecta ? '' : ` | Tu respuesta: ${respuestaSeleccionada ? respuestaSeleccionada.value : 'No contestada'}`}`;
        });

        // Generar resumen
        const resultadosContainer = document.createElement('div');
        resultadosContainer.innerHTML = '<h2>Resultados de la Prueba</h2>';
        resultadosContainer.innerHTML += `<p style="font-size:1.5em; font-weight: bold;">Obtuviste **${correctas}** respuestas correctas de **${preguntas.length}**.</p>`;
        
        // Agregar el resumen al inicio de la prueba
        const pruebaArea = document.getElementById('prueba-area');
        let resumen = pruebaArea.querySelector('#resumen-resultados');
        if (resumen) {
            resumen.innerHTML = resultadosContainer.innerHTML;
        } else {
            resumen = document.createElement('div');
            resumen.id = 'resumen-resultados';
            resumen.innerHTML = resultadosContainer.innerHTML;
            pruebaArea.insertBefore(resumen, document.getElementById('nombre-asignatura').nextSibling);
        }

        alert(`Prueba Finalizada. Respuestas correctas: ${correctas}/${preguntas.length}.`);
    }

    /**
     * Vuelve al menú principal.
     */
    function volverAlMenu() {
        stopTimer();
        currentAsignatura = '';
        document.getElementById('menu-principal').style.display = 'grid';
        document.getElementById('prueba-area').style.display = 'none';
        document.getElementById('timer-display').style.display = 'none';
        
        // Eliminar el resumen de resultados si existe
        const resumen = document.getElementById('resumen-resultados');
        if (resumen) resumen.remove();
    }

    /**
     * Muestra todas las respuestas correctas para todas las asignaturas en una ventana nueva.
     */
    function mostrarRespuestasGeneral() {
        if (currentAsignatura) {
            alert("Saliendo de la prueba actual para ver el resumen de respuestas.");
            volverAlMenu(); 
        }

        let resumenRespuestas = '<h2>Respuestas Correctas (Resumen General de 125 Preguntas)</h2>';
        
        for (const asignaturaKey in bancoDePreguntas) {
            const preguntas = bancoDePreguntas[asignaturaKey];
            const nombreAsignatura = {
                'matematicas': 'Matemáticas',
                'lenguaje': 'Lenguaje y Comunicación',
                'ciencias': 'Ciencias Naturales',
                'historia': 'Historia, Geografía y C. Sociales',
                'ingles': 'Inglés'
            }[asignaturaKey];

            resumenRespuestas += `<h3>${nombreAsignatura} (${preguntas.length} preguntas)</h3><ol>`;
            preguntas.forEach((p) => {
                resumenRespuestas += `<li>**P:** ${p.pregunta} | **R. Correcta:** <span style="color: green;">${p.respuestaCorrecta}</span></li>`;
            });
            resumenRespuestas += '</ol>';
        }

        // Crear una nueva ventana/pestaña para mostrar el resumen
        const nuevaVentana = window.open('', 'Respuestas', 'width=800,height=600');
        nuevaVentana.document.write(`
            <html>
            <head>
                <title>Respuestas Correctas 5° Básico</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; }
                    h3 { color: #d9534f; border-bottom: 1px dashed #ccc; padding-top: 10px; }
                    ol li { margin-bottom: 15px; font-size: 0.9em; }
                </style>
            </head>
            <body>${resumenRespuestas}</body>
            </html>
        `);
        nuevaVentana.document.close();
    }
    
    // Inicializar el estado del temporizador al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('timer-toggle-btn');
        if (timerEnabled) {
            toggleBtn.textContent = 'Desactivar Temporizador ⏱️';
        } else {
            toggleBtn.textContent = 'Activar Temporizador ⏱️';
        }
    });

</script>
