<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Pruebas 5° Básico - Chile</title>
    <style>
        /* Estilos CSS */
        body {
            font-family: 'Arial', sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #004d99; /* Azul Mineduc */
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        /* Estilos del Menú Principal */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .menu-button {
            padding: 20px;
            font-size: 1.1em;
            font-weight: bold;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .materia-btn { background-color: #d9534f; } /* Rojo */
        .materia-btn:hover { background-color: #c9302c; }

        .opcion-btn { background-color: #5cb85c; } /* Verde */
        .opcion-btn:hover { background-color: #4cae4c; }

        .timer-info {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 15px;
            padding: 10px;
            background-color: #f0ad4e; /* Amarillo-naranjo */
            color: #fff;
            border-radius: 5px;
            text-align: center;
        }

        /* Estilos de la Prueba */
        .prueba-container {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .pregunta {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #eee;
        }

        .pregunta p {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .opcion-respuesta {
            margin-left: 20px;
            margin-bottom: 5px;
            cursor: pointer;
        }

        .opcion-respuesta input[type="radio"] {
            margin-right: 8px;
        }
        
        /* Estilos para mostrar las respuestas */
        .respuesta-correcta {
            color: green;
            font-weight: bold;
            margin-top: 5px;
            padding-left: 20px;
            border-left: 3px solid green;
        }

        .boton-volver {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1em;
            background-color: #004d99;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .boton-volver:hover {
            background-color: #003366;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo-principal">Simulador de Pruebas de Validación 5° Básico (Chile)</h1>
    <p>Selecciona una opción para comenzar. Recuerda que cada prueba tiene una duración máxima de 90 minutos.</p>

    <div id="menu-principal" class="menu-grid">
        <button class="menu-button materia-btn" onclick="iniciarPrueba('matematicas')">Matemáticas 🔢</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('lenguaje')">Lenguaje y Comunicación 📖</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('ciencias')">Ciencias Naturales 🔬</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('historia')">Historia, Geografía y C. Sociales 🌎</button>
        <button class="menu-button materia-btn" onclick="iniciarPrueba('ingles')">Inglés 🇬🇧</button>
        
        <button class="menu-button opcion-btn" onclick="mostrarRespuestasGeneral()">Ver Respuestas (Todas) ✔️</button>
        <button id="timer-toggle-btn" class="menu-button opcion-btn" onclick="toggleTimer()">Activar/Desactivar Temporizador ⏱️</button>
    </div>

    <div id="timer-display" class="timer-info" style="display: none;">Temporizador: **90:00**</div>

    <div id="prueba-area" class="prueba-container" style="display: none;">
        <h2 id="nombre-asignatura"></h2>
        <div id="preguntas-container">
            </div>
        <button class="menu-button materia-btn" onclick="corregirPrueba()">Finalizar Prueba y Corregir</button>
        <button class="boton-volver" onclick="volverAlMenu()">Volver al Menú Principal</button>
    </div>
</div>

<script>
    // Variables Globales
    let timerEnabled = true; // Por defecto, el temporizador está activo
    let timerInterval;
    const DURACION_MAXIMA = 90 * 60; // 90 minutos en segundos
    let timeLeft = DURACION_MAXIMA;
    let currentAsignatura = '';
    const MAX_PREGUNTAS_SIMULACION = 3; // Límite para esta simulación. El temario real indica 25.

    // Estructura de las Preguntas (Basadas en los OA del temario)
    const bancoDePreguntas = {
        'matematicas': [
            // OA 1: Valor Posicional
            {
                pregunta: `(OA 1) ¿Cuál es el valor posicional del dígito **7** en el número 874.215.000?`,
                opciones: ['7 millones', '70 millones', '700 millones', '7 mil'],
                respuestaCorrecta: '70 millones'
            },
            // OA 3 y 4: Multiplicación y División en Problemas
            {
                pregunta: `(OA 3) Una caja contiene 45 lápices de colores. Si una escuela compró 12 cajas, ¿cuántos lápices compró en total?`,
                opciones: ['57', '450', '540', '570'],
                respuestaCorrecta: '540'
            },
            // OA 10: Fracción a Decimal
            {
                pregunta: `(OA 10) ¿Qué número decimal corresponde a la fracción propia $\\frac{3}{5}$?`,
                opciones: ['0,3', '0,5', '0,6', '0,8'],
                respuestaCorrecta: '0,6'
            }
        ],
        'lenguaje': [
            // OA 4: Lectura y comprensión de narraciones (Lenguaje figurado)
            {
                pregunta: `(OA 4) En la frase: "La luna era una moneda de plata en el cielo", ¿qué recurso literario se está utilizando?`,
                opciones: ['Personificación', 'Comparación', 'Rima', 'Hipérbole'],
                respuestaCorrecta: 'Comparación'
            },
            // OA 5: Poesía (Elementos formales)
            {
                pregunta: `(OA 5) ¿Cómo se llama a un conjunto de versos dentro de un poema?`,
                opciones: ['Rima', 'Estrofa', 'Narración', 'Metáfora'],
                respuestaCorrecta: 'Estrofa'
            },
            // OA 14: Escritura creativa (Conectores)
            {
                pregunta: `(OA 14) ¿Qué conector es el más adecuado para indicar una **consecuencia** en una narración?`,
                opciones: ['Además', 'Sin embargo', 'Por lo tanto', 'Aunque'],
                respuestaCorrecta: 'Por lo tanto'
            }
        ],
        'ciencias': [
            // OA 1: Célula, Tejidos, Órganos y Sistemas
            {
                pregunta: `(OA 1) ¿Cuál es la unidad estructural y funcional básica de todos los seres vivos, tanto plantas como animales?`,
                opciones: ['Tejido', 'Órgano', 'Sistema', 'Célula'],
                respuestaCorrecta: 'Célula'
            },
            // OA 5: Nutrición y Alimentos
            {
                pregunta: `(OA 5) ¿Qué grupo de alimentos es fundamental para la **reparación y el crecimiento** del cuerpo, como la carne y las legumbres?`,
                opciones: ['Vitaminas y minerales', 'Lípidos', 'Carbohidratos', 'Proteínas'],
                respuestaCorrecta: 'Proteínas'
            },
            // OA 10: Conductores y Aisladores de Electricidad
            {
                pregunta: `(OA 10) ¿Cuál de los siguientes materiales se clasifica como un **aislador** de electricidad, utilizado para manipulación segura?`,
                opciones: ['Cobre', 'Aluminio', 'Goma', 'Agua'],
                respuestaCorrecta: 'Goma'
            }
        ],
        'historia': [
            // OA 2: Conquista de Chile y América
            {
                pregunta: `(OA 2) ¿Qué evento bélico, liderado por Lautaro en 1553, fue un gran revés para la Conquista española en Chile?`,
                opciones: ['Batalla de Maipú', 'Desastre de Curalaba', 'Fundación de Santiago', 'Guerra del Pacífico'],
                respuestaCorrecta: 'Desastre de Curalaba'
            },
            // OA 6: Colonia y Sociedad Mestiza
            {
                pregunta: `(OA 6) ¿Qué término se utiliza para describir la mezcla cultural que se produjo entre españoles e indígenas durante el periodo colonial?`,
                opciones: ['Enmienda', 'Encomienda', 'Sincretismo', 'Parlamento'],
                respuestaCorrecta: 'Sincretismo'
            },
            // OA 13: Formación Ciudadana (Derechos Universales)
            {
                pregunta: `(OA 13) Los derechos humanos se caracterizan por ser universales, lo que significa que:`,
                opciones: ['Solo se aplican a los ciudadanos de un país.', 'No dependen de características individuales como etnia o sexo.', 'Son otorgados solo por el Estado.', 'Solo existen en tiempos de paz.'],
                respuestaCorrecta: 'No dependen de características individuales como etnia o sexo.'
            }
        ],
        'ingles': [
            // OA 5: Comprensión de Lectura (Funciones - describir posición)
            {
                pregunta: `(OA 5) Si lees la frase: "The book is **on** the desk", ¿dónde está el libro?`,
                opciones: ['Debajo del escritorio', 'Sobre el escritorio', 'Al lado del escritorio', 'Dentro del escritorio'],
                respuestaCorrecta: 'Sobre el escritorio'
            },
            // OA 5 y 15: Vocabulario (Familia)
            {
                pregunta: `(OA 15) ¿Cuál es la palabra en inglés para referirse al 'padre' de tu madre?`,
                opciones: ['Father', 'Brother', 'Grandfather', 'Uncle'],
                respuestaCorrecta: 'Grandfather'
            },
            // OA 15: Expresión Escrita (Describir acciones cotidianas)
            {
                pregunta: `(OA 15) ¿Qué frase usarías para expresar que te gusta la pizza?`,
                opciones: ['I don\'t like pizza.', 'I like pizza.', 'I wear pizza.', 'I sleep pizza.'],
                respuestaCorrecta: 'I like pizza.'
            }
        ]
    };

    // --- FUNCIONES DEL TEMPORIZADOR ---

    /**
     * Alterna la activación/desactivación del temporizador.
     * Actualiza el texto del botón y el estado de la variable global.
     */
    function toggleTimer() {
        timerEnabled = !timerEnabled;
        const toggleBtn = document.getElementById('timer-toggle-btn');
        if (timerEnabled) {
            toggleBtn.textContent = 'Desactivar Temporizador ⏱️';
            // Mostrar si estamos en una prueba, de lo contrario, ocultar.
            if (currentAsignatura) {
                document.getElementById('timer-display').style.display = 'block';
                startTimer();
            }
        } else {
            toggleBtn.textContent = 'Activar Temporizador ⏱️';
            clearInterval(timerInterval);
            document.getElementById('timer-display').style.display = 'none';
        }
        alert(`Temporizador ha sido ${timerEnabled ? 'ACTIVADO' : 'DESACTIVADO'}.`);
    }

    /**
     * Inicia el contador de 90 minutos.
     */
    function startTimer() {
        clearInterval(timerInterval); // Asegura que no haya múltiples intervalos
        timeLeft = DURACION_MAXIMA;
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("¡Tiempo finalizado! La prueba ha terminado.");
                corregirPrueba(); // Corregir automáticamente al terminar el tiempo
            }
        }, 1000);
    }

    /**
     * Detiene el contador.
     */
    function stopTimer() {
        clearInterval(timerInterval);
    }

    /**
     * Actualiza la visualización del tiempo restante.
     */
    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        document.getElementById('timer-display').textContent = `Tiempo restante: ${display}`;
    }

    // --- FUNCIONES DE LA SIMULACIÓN ---

    /**
     * Inicia la simulación de la prueba para una asignatura.
     * @param {string} asignatura - La clave de la asignatura.
     */
    function iniciarPrueba(asignatura) {
        currentAsignatura = asignatura;
        const nombreFormal = {
            'matematicas': 'Matemáticas',
            'lenguaje': 'Lenguaje y Comunicación',
            'ciencias': 'Ciencias Naturales',
            'historia': 'Historia, Geografía y Ciencias Sociales',
            'ingles': 'Inglés'
        }[asignatura];

        document.getElementById('menu-principal').style.display = 'none';
        document.getElementById('prueba-area').style.display = 'block';
        document.getElementById('nombre-asignatura').textContent = `Prueba de ${nombreFormal}`;

        if (timerEnabled) {
            document.getElementById('timer-display').style.display = 'block';
            startTimer();
        }

        cargarPreguntas(asignatura);
    }

    /**
     * Carga las preguntas de la asignatura seleccionada en la interfaz.
     * @param {string} asignatura - La clave de la asignatura.
     */
    function cargarPreguntas(asignatura) {
        const preguntas = bancoDePreguntas[asignatura];
        const container = document.getElementById('preguntas-container');
        container.innerHTML = ''; // Limpiar preguntas anteriores

        preguntas.forEach((p, index) => {
            const numPregunta = index + 1;
            const preguntaDiv = document.createElement('div');
            preguntaDiv.className = 'pregunta';
            preguntaDiv.id = `pregunta-${numPregunta}`;
            
            let html = `<p>${numPregunta}. ${p.pregunta}</p>`;
            
            p.opciones.forEach((opcion, i) => {
                const id = `q${numPregunta}-op${i}`;
                html += `
                    <div class="opcion-respuesta">
                        <input type="radio" id="${id}" name="respuesta-${numPregunta}" value="${opcion}">
                        <label for="${id}">${opcion}</label>
                    </div>
                `;
            });
            
            preguntaDiv.innerHTML = html;
            container.appendChild(preguntaDiv);
        });
    }

    /**
     * Procesa y muestra los resultados de la prueba actual.
     */
    function corregirPrueba() {
        if (timerEnabled) {
            stopTimer();
        }

        const preguntas = bancoDePreguntas[currentAsignatura];
        let correctas = 0;
        const resultadosContainer = document.createElement('div');
        resultadosContainer.innerHTML = '<h2>Resultados</h2>';
        
        preguntas.forEach((p, index) => {
            const numPregunta = index + 1;
            const nombreInput = `respuesta-${numPregunta}`;
            const respuestaSeleccionada = document.querySelector(`input[name="${nombreInput}"]:checked`);
            const preguntaDiv = document.getElementById(`pregunta-${numPregunta}`);
            const esCorrecta = respuestaSeleccionada && respuestaSeleccionada.value === p.respuestaCorrecta;

            // Mostrar el resultado en la pregunta
            const resultadoHTML = document.createElement('p');
            resultadoHTML.className = 'respuesta-correcta';
            resultadoHTML.textContent = `Respuesta Correcta: ${p.respuestaCorrecta}`;
            
            if (esCorrecta) {
                correctas++;
                preguntaDiv.style.backgroundColor = '#e6ffe6'; // Verde claro
            } else {
                preguntaDiv.style.backgroundColor = '#ffe6e6'; // Rojo claro
            }

            // Evitar duplicar el mensaje si se corrige dos veces
            if (!preguntaDiv.querySelector('.respuesta-correcta')) {
                 preguntaDiv.appendChild(resultadoHTML);
            }
        });

        resultadosContainer.innerHTML += `<p>Obtuviste **${correctas}** respuestas correctas de **${preguntas.length}**.</p>`;
        
        // Agregar el resumen al inicio de la prueba
        const pruebaArea = document.getElementById('prueba-area');
        let resumen = pruebaArea.querySelector('#resumen-resultados');
        if (resumen) {
            resumen.innerHTML = resultadosContainer.innerHTML;
        } else {
            resumen = document.createElement('div');
            resumen.id = 'resumen-resultados';
            resumen.innerHTML = resultadosContainer.innerHTML;
            pruebaArea.insertBefore(resumen, document.getElementById('nombre-asignatura').nextSibling);
        }

        alert(`Prueba Finalizada. Respuestas correctas: ${correctas}/${preguntas.length}.`);
    }

    /**
     * Vuelve al menú principal.
     */
    function volverAlMenu() {
        stopTimer();
        currentAsignatura = '';
        document.getElementById('menu-principal').style.display = 'grid';
        document.getElementById('prueba-area').style.display = 'none';
        document.getElementById('timer-display').style.display = 'none';

        // Eliminar el resumen de resultados si existe
        const resumen = document.getElementById('resumen-resultados');
        if (resumen) {
            resumen.remove();
        }
    }

    /**
     * Muestra todas las respuestas correctas para todas las asignaturas.
     */
    function mostrarRespuestasGeneral() {
        if (currentAsignatura) {
            alert("Debes terminar o salir de la prueba actual para ver las respuestas de todas las asignaturas.");
            return;
        }

        let resumenRespuestas = '<h2>Respuestas Correctas por Asignatura:</h2>';
        
        for (const asignaturaKey in bancoDePreguntas) {
            const preguntas = bancoDePreguntas[asignaturaKey];
            const nombreAsignatura = {
                'matematicas': 'Matemáticas',
                'lenguaje': 'Lenguaje y Comunicación',
                'ciencias': 'Ciencias Naturales',
                'historia': 'Historia, Geografía y C. Sociales',
                'ingles': 'Inglés'
            }[asignaturaKey];

            resumenRespuestas += `<h3>${nombreAsignatura}</h3><ul>`;
            preguntas.forEach((p, index) => {
                resumenRespuestas += `<li>**Pregunta ${index + 1}:** ${p.pregunta} | **Respuesta Correcta:** ${p.respuestaCorrecta}</li>`;
            });
            resumenRespuestas += '</ul>';
        }

        // Crear una nueva ventana/pestaña para mostrar el resumen, para no interferir con la simulación.
        const nuevaVentana = window.open('', 'Respuestas', 'width=700,height=600');
        nuevaVentana.document.write(`
            <html>
            <head>
                <title>Respuestas Correctas</title>
                <style>body { font-family: Arial, sans-serif; padding: 20px; }</style>
            </head>
            <body>${resumenRespuestas}</body>
            </html>
        `);
        nuevaVentana.document.close();
    }
    
    // Inicializar el estado del temporizador al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('timer-toggle-btn');
        if (timerEnabled) {
            toggleBtn.textContent = 'Desactivar Temporizador ⏱️';
        } else {
            toggleBtn.textContent = 'Activar Temporizador ⏱️';
        }
    });

</script>

</body>
</html>
